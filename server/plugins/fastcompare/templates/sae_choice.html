<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie preferences</title><style>body{font:16px system-ui;margin:2rem auto;max-width:1100px;padding:0 1rem}main{display:grid;grid-template-columns:1fr 1fr;gap:2rem}.movies{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}img{width:100%;max-height:220px;object-fit:contain}button{padding:1rem;margin:.5rem;cursor:pointer}@media(max-width:700px){main{grid-template-columns:1fr}}</style></head><body><h1>Which group of movies do you prefer?</h1><p>Question {{question}} of {{total}}</p><main>{% for group,title in [(positive,'Group A'),(negative,'Group B')] %}<section><h2>{{title}}</h2><div class="movies">{% for m in group %}<article>{% if m.get('url') %}<img src="{{m['url']}}" alt="">{% endif %}<p>{{m.get('movie',m.get('title','Movie'))}}</p></article>{% endfor %}</div></section>{% endfor %}</main><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><button name="response" value="positive">Prefer group A</button><button name="response" value="negative">Prefer group B</button><button name="response" value="both">Like both</button><button name="response" value="neither">Dislike both</button></form></body></html>
